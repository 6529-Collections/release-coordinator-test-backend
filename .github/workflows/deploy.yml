# The dispatch contract mirrors 6529seize-backend. The job below deliberately
# builds and records only the sample backend; it never receives AWS credentials.
name: Deploy a service

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        description: Environment
        required: true
        default: staging
        options: [staging, prod]
      service:
        type: choice
        description: Service
        required: true
        default: api
        options:
          - api
          - aggregatedActivityLoop
          - attachmentsOrchestrator
          - attachmentsProcessor
          - artCurationNftWatchLoop
          - claimsBuilder
          - claimsMediaArweaveUploader
          - customReplayLoop
          - dbDumpsDaily
          - dbMigrationsLoop
          - delegationsLoop
          - discoverEnsLoop
          - dropMediaIngestStorage
          - dropMediaSanitizer
          - dropVideoConversionInvokerLoop
          - ethPriceLoop
          - externalCollectionLiveTailingLoop
          - externalCollectionSnapshottingLoop
          - helpBotReplyLoop
          - marketStatsLoop
          - marketDepthStreamLoop
          - mediaResizerLoop
          - membershipRefreshLoop
          - membershipRefreshDispatcherLoop
          - mintAnnouncementsLoop
          - nextgenContractLoop
          - nextgenMediaImageResolutions
          - nextgenMediaProxyInterceptor
          - nextgenMediaUploader
          - nextgenMetadataLoop
          - nftHistoryLoop
          - nftLinkRefresherLoop
          - nftLinkMediaPreviewLoop
          - nftOwnersLoop
          - nftsLoop
          - overRatesRevocationLoop
          - ownersBalancesLoop
          - populateHistoricConsolidatedTdh
          - pushNotificationsHandler
          - rateEventProcessingLoop
          - releaseNotesGenerationLoop
          - refreshEnsLoop
          - rememesLoop
          - royaltiesLoop
          - s3Uploader
          - subscriptionsDaily
          - subscriptionsTopUpLoop
          - xTdhGrantsReviewerLoop
          - tdhHistoryLoop
          - tdhLoop
          - teamLoop
          - transactionsLoop
          - transactionsProcessingLoop
          - waveDecisionExecutionLoop
          - waveLeaderboardSnapshotterLoop
          - waveDropMetricsRefreshLoop
          - waveScoreRefreshLoop
          - xTdhLoop
          - artworkDocumentationStorage
          - artworkDocumentationProcessor
      expected_source_sha:
        type: string
        description: Exact reviewed source commit; fail if the branch resolves differently
        required: false
      db_schema_scope:
        type: choice
        description: Schema scope for dbMigrationsLoop; other services require full
        required: false
        default: full
        options:
          - full
          - wallet-transfer-analysis
          - claims-media-upload
          - nft-link-page-retry
          - membership-refresh
          - membership-evaluator-index
          - membership-runtime-control
      membership_runtime_mode:
        type: choice
        description: Membership processing mode; production requires inactive
        required: false
        default: inactive
        options: [inactive, staging-fixture-v1, staging-controlled-v1]
      membership_source_tracking_mode:
        type: choice
        description: Independent source tracking; inactive by default and staging only
        required: false
        default: inactive
        options: [inactive, tracking-v1]
      membership_read_mode:
        type: choice
        description: API membership reader; legacy by default and controlled staging only
        required: false
        default: legacy
        options: [legacy, staging-controlled-v1]
      membership_shadow_mode:
        type: choice
        description: API membership shadow comparison; off by default
        required: false
        default: "off"
        options: ["off", staging-controlled-v1]
      membership_reader_profile_ids:
        type: string
        description: Comma-separated controlled staging profile IDs (maximum 20)
        required: false
        default: ""
      membership_reader_coverage_revision:
        type: string
        description: Audited staging source coverage revision required for trusted reads
        required: false
        default: ""
      membership_worker_mapping_enabled:
        type: boolean
        description: Enable a staging membership worker SQS mapping explicitly
        required: false
        default: false
      membership_dispatch_schedule_enabled:
        type: boolean
        description: Enable a staging membership dispatcher schedule explicitly
        required: false
        default: false
      release_pull_request:
        type: string
        description: Merged PR represented by this production release
        required: false
      release_note_publish:
        type: boolean
        description: Publish the accumulated release note for this PR after success
        required: false
        default: false
      release_group_services:
        type: string
        description: Comma-separated services in this production release group
        required: false
      release_note_groups:
        type: string
        description: JSON array of per-PR production release-note groups
        required: false
      release_note_opt_out:
        type: boolean
        description: Suppress autonomous release notes only when explicitly requested by the user
        required: false
        default: false

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-control-${{ github.event.inputs.environment }}
  cancel-in-progress: false

run-name: Deploy ${{ github.event.inputs.service }} to ${{ github.event.inputs.environment }}

jobs:
  build-and-deploy:
    name: Build and deploy ${{ github.event.inputs.service }} to ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-service-${{ github.event.inputs.environment }}-${{ github.event.inputs.service }}
      cancel-in-progress: false
    env:
      INPUT_ENVIRONMENT: ${{ github.event.inputs.environment }}
      INPUT_SERVICE: ${{ github.event.inputs.service }}
      EXPECTED_SOURCE_SHA: ${{ github.event.inputs.expected_source_sha }}
      DB_SCHEMA_SCOPE: ${{ github.event.inputs.db_schema_scope || 'full' }}
    steps:
      - name: Validate dispatch inputs before using code
        run: |
          set -euo pipefail
          [[ "$INPUT_ENVIRONMENT" =~ ^(staging|prod)$ ]]
          [[ "$INPUT_SERVICE" =~ ^[A-Za-z][A-Za-z0-9]{0,80}$ ]]
          if [ "$INPUT_ENVIRONMENT" = staging ]; then
            test "$GITHUB_REF" = refs/heads/1a-staging
          else
            test "$GITHUB_REF" = refs/heads/main
          fi
          if [ -n "$EXPECTED_SOURCE_SHA" ]; then
            [[ "$EXPECTED_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
            test "$EXPECTED_SOURCE_SHA" = "$GITHUB_SHA"
          fi
          if [ "$DB_SCHEMA_SCOPE" != full ] && [ "$INPUT_SERVICE" != dbMigrationsLoop ]; then
            echo "db_schema_scope is only supported for dbMigrationsLoop" >&2
            exit 1
          fi
      - name: Check out exact backend SHA
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22.17.1"
      - name: Install locked package
        run: npm ci --ignore-scripts
      - name: Check and build the exact sample backend
        env:
          SANDBOX_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          npm test
          npm run build
      - name: Record the fake service deployment
        run: |
          mkdir -p fake-deployment/dist
          cp -R dist/. fake-deployment/dist/
          node scripts/fake-deployment-evidence.mjs create \
            backend "$INPUT_ENVIRONMENT" "$GITHUB_SHA" "$GITHUB_RUN_ID" \
            .github/workflows/deploy.yml "$INPUT_SERVICE" \
            fake-deployment/dist/build-manifest.json \
            fake-deployment/deployment-evidence.json
      - name: Upload fake service deployment evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fake-backend-${{ github.event.inputs.environment }}-${{ github.event.inputs.service }}-${{ github.run_id }}
          path: fake-deployment
          if-no-files-found: error
          retention-days: 30
