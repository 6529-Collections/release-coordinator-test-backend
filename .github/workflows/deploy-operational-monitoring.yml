name: Deploy operational monitoring

on:
  workflow_dispatch:
    inputs:
      environment:
        required: true
        type: choice
        options: [staging, prod]
      commit_sha:
        description: Full merged commit SHA to deploy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: operational-monitoring-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  monitoring:
    if: github.ref == 'refs/heads/main'
    environment: monitoring-${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact merged commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the exact merged commit
        env:
          EXPECTED_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$EXPECTED_SHA" origin/main
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22.17.1"
      - name: Build the isolated sample monitoring artifact
        working-directory: ops/monitoring
        env:
          SANDBOX_SOURCE_COMMIT: ${{ inputs.commit_sha }}
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Record the fake monitoring deployment
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          SOURCE_SHA: ${{ inputs.commit_sha }}
        run: |
          mkdir -p fake-deployment/dist
          cp -R ops/monitoring/dist/. fake-deployment/dist/
          node scripts/fake-deployment-evidence.mjs create \
            monitoring "$ENVIRONMENT" "$SOURCE_SHA" "$GITHUB_RUN_ID" \
            .github/workflows/deploy-operational-monitoring.yml - \
            fake-deployment/dist/build-manifest.json \
            fake-deployment/deployment-evidence.json
      - name: Upload fake monitoring deployment evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fake-monitoring-${{ inputs.environment }}-${{ github.run_id }}
          path: fake-deployment
          if-no-files-found: error
          retention-days: 30
